[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emoemg"
version = "0.1.0"
description = "Eye-region action detection from four-channel wearable EEG recordings"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]
train = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

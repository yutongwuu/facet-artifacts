<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">FACET research flow</title><desc id="desc">Four-channel mixed recordings and video annotations feed quality-controlled action learning, held-out evaluation and offline predictions. Physiological source separation is a separate future study.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#697a76"/></marker></defs><rect width="1200" height="780" fill="#f5f5ee"/><style>text{font-family:Arial,sans-serif;fill:#183c35}.small{font-size:14px;fill:#687d75}.head{font-size:19px;font-weight:600}.label{font-size:12px;letter-spacing:2px;font-weight:700}</style><text x="32" y="38" class="label">01  RECORD &amp; LABEL</text><text x="330" y="38" class="label">02  LEARN</text><text x="635" y="38" class="label">03  VERIFY</text><text x="935" y="38" class="label">04  INTERPRET</text><rect x="30" y="85" width="245" height="133" rx="12" fill="#fffef9" stroke="#183c35" stroke-width="1.5"/><text x="48" y="116" class="head">4-channel headband</text><text x="48" y="142" class="small">Mixed scalp potentials</text><text x="48" y="163" class="small">EEG + eye/face activity</text><text x="48" y="184" class="small">+ contact / motion artifacts</text><rect x="30" y="250" width="245" height="133" rx="12" fill="#fffef9" stroke="#183c35" stroke-width="1.5"/><text x="48" y="281" class="head">Synchronized labels</text><text x="48" y="307" class="small">Eye-region video → onset / offset</text><text x="48" y="328" class="small">Blink · frown · eyebrow raise</text><text x="48" y="349" class="small">Rest + confound actions</text><rect x="330" y="85" width="245" height="133" rx="12" fill="#fffef9" stroke="#183c35" stroke-width="1.5"/><text x="348" y="116" class="head">Raw signal &amp; quality</text><text x="348" y="142" class="small">Keep the raw recording</text><text x="348" y="163" class="small">Timing, dropouts, flat signals</text><text x="348" y="184" class="small">Preprocessing fits device limits</text><rect x="330" y="250" width="245" height="133" rx="12" fill="#fffef9" stroke="#183c35" stroke-width="1.5"/><text x="348" y="281" class="head">Session-based partition</text><text x="348" y="307" class="small">Train / validation / held-out test</text><text x="348" y="328" class="small">Split before overlapping windows</text><text x="348" y="349" class="small">Fit transforms on training only</text><rect x="330" y="415" width="245" height="133" rx="12" fill="#fffef9" stroke="#b76437" stroke-width="1.5"/><text x="348" y="446" class="head">Compare model routes</text><text x="348" y="472" class="small">Feature + linear baseline: coded</text><text x="348" y="493" class="small">Compact temporal DNN: proposed</text><text x="348" y="514" class="small">Same split, labels and metrics</text><rect x="635" y="250" width="245" height="153" rx="12" fill="#fffef9" stroke="#b76437" stroke-width="1.5"/><text x="653" y="281" class="head">Held-out evaluation</text><text x="653" y="307" class="small">Per-action precision / recall</text><text x="653" y="328" class="small">False alarms per minute</text><text x="653" y="349" class="small">Rewear / day / person transfer</text><text x="653" y="370" class="small">Calibrate or reject uncertainty</text><rect x="935" y="250" width="235" height="153" rx="12" fill="#fffef9" stroke="#b76437" stroke-width="1.5"/><text x="953" y="281" class="head">Offline action timeline</text><text x="953" y="307" class="small">Blink · frown · eyebrow raise</text><text x="953" y="328" class="small">Rest / uncertain / poor quality</text><text x="953" y="349" class="small">Output: when &amp; which action</text><text x="953" y="370" class="small">No inferred emotion</text><path d="M275 151 L330 151" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M452 218 L452 250" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M275 316 L330 316" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M452 383 L452 415" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M575 482H603V327H635" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M880 327 L935 327" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><text x="636" y="449" class="label">SUCCESS CRITERION</text><text x="636" y="478" class="small">Useful action information survives</text><text x="636" y="501" class="small">held-out testing and realistic confounds.</text><text x="636" y="532" class="small">Working collection + DNN is a scenario,</text><text x="636" y="555" class="small">not a reported experimental result.</text><path d="M1052 403V605H170V635" fill="none" stroke="#8a9190" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="30" y="635" width="1140" height="112" rx="12" fill="#fffef9" stroke="#8a9190" stroke-width="1.5" stroke-dasharray="6 5"/><text x="48" y="666" class="head">Future: understand sources, then study selective artifact handling</text><text x="48" y="692" class="small">Reference EOG / EMG → characterize signal origin → test artifact reduction AND preservation of neural information.</text><text x="48" y="713" class="small">Action recognition alone does not establish source separation or improved EEG cleaning.</text></svg>
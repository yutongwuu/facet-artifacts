<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">FACET: frown to interactive feedback</title><desc id="desc">A wearer frowns. A four-channel headband senses mixed signals. A compact model detects the action. An event gate checks quality, stability and cooldown. An accepted event activates the UI and may trigger a predefined robot response, returning feedback to the wearer. This is a proposed interaction extension.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#697a76"/></marker></defs><rect width="1200" height="510" rx="16" fill="#f6f5ef"/><style>text{font-family:Arial,sans-serif;fill:#173d35}.title{font-size:20px;font-weight:600}.small{font-size:15px;fill:#61746c}.label{font-size:12px;letter-spacing:2px;fill:#b76437}</style><text x="35" y="35" class="label">PROPOSED INTERACTION / FROM ACTION TO FEEDBACK</text><rect x="35" y="65" width="330" height="120" rx="12" fill="#fffef9" stroke="#bdc9bf"/><text x="55" y="90" class="label">01 / MOVE</text><text x="55" y="119" class="title">Person frowns</text><text x="55" y="145" class="small">Observable eye-region movement</text><text x="55" y="167" class="small">Action label, no emotion inference</text><rect x="435" y="65" width="330" height="120" rx="12" fill="#fffef9" stroke="#bdc9bf"/><text x="455" y="90" class="label">02 / SENSE</text><text x="455" y="119" class="title">4-channel headband</text><text x="455" y="145" class="small">Mixed electrical recordings</text><text x="455" y="167" class="small">Quality-controlled signal windows</text><rect x="835" y="65" width="330" height="120" rx="12" fill="#fffef9" stroke="#bdc9bf"/><text x="855" y="90" class="label">03 / DETECT</text><text x="855" y="119" class="title">Compact action model</text><text x="855" y="145" class="small">Window-level action prediction</text><text x="855" y="167" class="small">Offline replay first; live use later</text><rect x="835" y="250" width="330" height="120" rx="12" fill="#fffef9" stroke="#bdc9bf"/><text x="855" y="275" class="label">04 / GATE</text><text x="855" y="304" class="title">Accept an action event</text><text x="855" y="330" class="small">Quality + stability + cooldown</text><text x="855" y="352" class="small">Uncertain input → no trigger</text><rect x="435" y="250" width="330" height="120" rx="12" fill="#fffef9" stroke="#bdc9bf"/><text x="455" y="275" class="label">05 / INTERACT</text><text x="455" y="304" class="title">Activate the UI</text><text x="455" y="330" class="small">Accepted event updates the interface</text><text x="455" y="352" class="small">Show state / acknowledgement</text><rect x="35" y="250" width="330" height="120" rx="12" fill="#fffef9" stroke="#bdc9bf"/><text x="55" y="275" class="label">06 / RESPOND</text><text x="55" y="304" class="title">Optional robot feedback</text><text x="55" y="330" class="small">Adapter → predefined response</text><text x="55" y="352" class="small">Feedback returns to the wearer</text><path d="M365 125H435" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M765 125H835" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1000 185V250" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M835 310H765" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M435 310H365" fill="none" stroke="#697a76" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M35 310H15V125H35" fill="none" stroke="#b76437" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="35" y="428" class="label">EXTENSION BOUNDARY</text><text x="35" y="457" class="small">UI triggering and robot integration are planned; offline recognition does not establish real-time deployment.</text><text x="35" y="482" class="small">Validate event false alarms, response acknowledgement and end-to-end latency before reporting a working loop.</text></svg>
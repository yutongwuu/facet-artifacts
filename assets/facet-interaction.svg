<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">FACET: frown to interactive feedback</title><desc id="desc">A wearer frowns. A four-channel headband senses mixed signals. A compact model detects the action. An event gate checks quality, stability and cooldown. An accepted event activates the UI and may trigger a predefined robot response, returning feedback to the wearer. This is a proposed interaction extension.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#647b96"/></marker></defs><rect width="1200" height="510" rx="4" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#10243a}.title{font-size:20px;font-weight:600}.small{font-size:15px;fill:#53677e}.label{font-size:12px;letter-spacing:2px;fill:#2563eb}</style><text x="35" y="35" class="label">PROPOSED INTERACTION / FROM ACTION TO FEEDBACK</text><rect x="35" y="65" width="330" height="120" rx="4" fill="#ffffff" stroke="#c7d3e2"/><text x="55" y="90" class="label">01 / MOVE</text><text x="55" y="119" class="title">Person frowns</text><text x="55" y="145" class="small">Observable eye-region movement</text><text x="55" y="167" class="small">Action label, no emotion inference</text><rect x="435" y="65" width="330" height="120" rx="4" fill="#ffffff" stroke="#c7d3e2"/><text x="455" y="90" class="label">02 / SENSE</text><text x="455" y="119" class="title">4-channel headband</text><text x="455" y="145" class="small">Mixed electrical recordings</text><text x="455" y="167" class="small">Quality-controlled signal windows</text><rect x="835" y="65" width="330" height="120" rx="4" fill="#ffffff" stroke="#c7d3e2"/><text x="855" y="90" class="label">03 / DETECT</text><text x="855" y="119" class="title">Compact action model</text><text x="855" y="145" class="small">Window-level action prediction</text><text x="855" y="167" class="small">Offline replay first; live use later</text><rect x="835" y="250" width="330" height="120" rx="4" fill="#ffffff" stroke="#c7d3e2"/><text x="855" y="275" class="label">04 / GATE</text><text x="855" y="304" class="title">Accept an action event</text><text x="855" y="330" class="small">Quality + stability + cooldown</text><text x="855" y="352" class="small">Uncertain input → no trigger</text><rect x="435" y="250" width="330" height="120" rx="4" fill="#ffffff" stroke="#c7d3e2"/><text x="455" y="275" class="label">05 / INTERACT</text><text x="455" y="304" class="title">Activate the UI</text><text x="455" y="330" class="small">Accepted event updates the interface</text><text x="455" y="352" class="small">Show state / acknowledgement</text><rect x="35" y="250" width="330" height="120" rx="4" fill="#ffffff" stroke="#c7d3e2"/><text x="55" y="275" class="label">06 / RESPOND</text><text x="55" y="304" class="title">Optional robot feedback</text><text x="55" y="330" class="small">Adapter → predefined response</text><text x="55" y="352" class="small">Feedback returns to the wearer</text><path d="M365 125H435" fill="none" stroke="#647b96" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M765 125H835" fill="none" stroke="#647b96" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M1000 185V250" fill="none" stroke="#647b96" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M835 310H765" fill="none" stroke="#647b96" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M435 310H365" fill="none" stroke="#647b96" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M35 310H15V125H35" fill="none" stroke="#2563eb" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="35" y="428" class="label">EXTENSION BOUNDARY</text><text x="35" y="457" class="small">UI triggering and robot integration are planned; offline recognition does not establish real-time deployment.</text><text x="35" y="482" class="small">Validate event false alarms, response acknowledgement and end-to-end latency before reporting a working loop.</text><g fill="none" stroke="#2563eb" stroke-width="1.4" stroke-linecap="square" aria-hidden="true"><path d="M305 87h38m-31 7h24m-18 7h12"/><path d="M709 96h8l4-8 5 16 5-10h11"/><rect x="1112" y="85" width="24" height="24" rx="2"/><path d="M1118 91h12v12h-12zm-6 0h-5m5 6h-5m5 6h-5m29-12h5m-5 6h5m-5 6h5"/><path d="M1114 276l8 8 17-18"/><rect x="709" y="268" width="34" height="24" rx="2"/><path d="M709 274h34m-17 18v6m-9 0h18"/><rect x="309" y="270" width="30" height="21" rx="3"/><path d="M316 280h2m12 0h2m-16 6h16m-8-16v-6m-4 0h8m-23 15h4m30 0h4"/></g></svg>